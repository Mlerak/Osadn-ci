<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Osadníci – multiplayer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100dvh;color:#1d2b36;font:600 16px/1.35 Nunito,'Segoe UI',Arial,sans-serif;background-attachment:fixed;transition:background .8s}
body.s0{background:linear-gradient(160deg,#aef0b8,#58cfa5 55%,#2fa8d5)}
body.s1{background:linear-gradient(170deg,#4ec3f7,#8fe0ff 45%,#ffe08a)}
body.s2{background:linear-gradient(160deg,#ffcf8a,#e8812f 55%,#8c3d1b)}
body.s3{background:linear-gradient(160deg,#eaf7ff,#9bcdf0 55%,#4a77b8)}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#fx i{position:absolute;top:-8%;opacity:.75;font-style:normal;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(118vh) rotate(360deg)}}
@keyframes pulse{50%{opacity:.4}}@keyframes pop{from{transform:scale(.7);opacity:0}}
.pulse,.hx{animation:pulse 1s infinite}
@media (prefers-reduced-motion:reduce){#fx{display:none}.pulse,.hx,.toast.new{animation:none}.die.tumble{animation:none;opacity:.6}}
button,select,input{font:inherit;color:#1d2b36;border:0;border-radius:14px;padding:10px 14px;background:#fff;box-shadow:0 3px 0 #0003;cursor:pointer;font-weight:700}
input{box-shadow:inset 0 2px 0 #0002,0 0 0 2px #cfd8dc;cursor:text}
button:focus-visible,select:focus-visible,input:focus-visible,.hot:focus-visible{outline:3px solid #ffd43b;outline-offset:2px}
button:disabled{opacity:.4;box-shadow:none;cursor:default}button.sel{outline:3px solid #ffd43b}
.go{background:linear-gradient(#5ee07a,#2fbf56);color:#fff;text-shadow:0 1px 0 #0003}.big{font-size:20px;padding:14px 22px}
.dim{color:#5a6b78;font-weight:600}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
#menu{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;position:relative;z-index:1}
.card{background:#ffffffee;border-radius:26px;padding:24px;max-width:420px;width:100%;box-shadow:0 8px 0 #0002}
.card h1{font-size:36px;margin:0 0 12px;text-align:center}.card hr{border:0;border-top:2px dashed #cfd8dc;margin:14px 0}
.code{font-size:46px;letter-spacing:.3em;text-align:center;font-weight:700}
.pl{display:flex;align-items:center;padding:8px 12px;border-radius:12px;background:#f1f5f7;margin:6px 0;border-left:10px solid}
#game{display:flex;flex-direction:column;height:100dvh;position:relative;z-index:1;padding-top:env(safe-area-inset-top,0px)}
#top{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 12px}#top #turn{justify-self:start}
#turn{background:#fff;border-radius:999px;padding:7px 16px;font-size:18px;font-weight:700;box-shadow:0 3px 0 #0003;display:flex;align-items:center;gap:8px}
#turn small{font-weight:600;color:#5a6b78}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px #0003;flex:none}
#season{background:#ffffffd9;border-radius:999px;padding:6px 14px;font-size:15px;box-shadow:0 3px 0 #0002}
#stage{flex:1;min-height:0;position:relative}#b{width:100%;height:100%}
#feed{position:absolute;top:4px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:3;width:max-content;max-width:94%}
.toast{background:#1d2b36d9;color:#fff;padding:4px 14px;border-radius:999px;font-size:14px;opacity:.6}.toast.new{opacity:1;font-size:17px;animation:pop .35s}
#msg{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);color:#b3261e;background:#fff;border-radius:10px;padding:0 8px}
.hot{cursor:pointer}
#dock{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#ffffffc4;backdrop-filter:blur(8px);border-top:3px solid #fff}
#hand{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:76px;align-items:center}
.rc{width:54px;height:74px;border-radius:10px;background:repeating-linear-gradient(135deg,#ffffff26 0 3px,transparent 3px 7px),linear-gradient(160deg,color-mix(in srgb,var(--c) 65%,#fff),var(--c));border:3px solid #fff;box-shadow:0 3px 0 #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#1d2b36}
.rc .ri{font-size:26px;line-height:1}.rc small{font-size:10px;font-weight:600}
#ac{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.ab{display:flex;flex-direction:column;align-items:center;min-width:66px;font-size:12px;padding:6px 10px}.ab span{font-size:24px;line-height:1.1}
.dice{display:flex;gap:6px}.die{font-size:54px;line-height:1;display:inline-block;user-select:none}
.die.tumble{animation:tumble .45s linear infinite}.die.tumble:nth-child(2){animation-direction:reverse;animation-duration:.55s}
@keyframes tumble{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(6px,-14px) rotate(100deg)}50%{transform:translate(-5px,0) rotate(200deg)}75%{transform:translate(5px,-9px) rotate(290deg)}100%{transform:translate(0,0) rotate(360deg)}}
#modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:10;padding:12px}
.mbox{background:#fff;border-radius:22px;padding:20px;max-width:94vw;max-height:88dvh;overflow:auto;min-width:270px;box-shadow:0 8px 0 #0003}
.mbox h2{margin:0 0 8px;font-size:22px}.drow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:18px}
.drow b{min-width:1.5em;text-align:center}.cost{border-collapse:collapse;margin:6px 0;font-size:16px}.cost td{padding:4px 10px;border-top:1px solid #e3e8eb}
.i{width:1.15em;height:1.15em;vertical-align:-.22em;flex:none}.rc .ri .i{width:32px;height:32px}
svg{shape-rendering:geometricPrecision;text-rendering:geometricPrecision}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(#ffffff55 1.2px,transparent 1.7px) 0 0/22px 22px;opacity:.5}
.rc{outline:1.5px solid #0003}
#sbox{text-align:center}
#sname{font-size:clamp(30px,5.2vw,52px);font-weight:900;letter-spacing:.08em;line-height:1;color:#fff;-webkit-text-stroke:2px #1d2b36;paint-order:stroke fill;text-shadow:0 4px 0 #1d2b3655}
#season{display:inline-block;margin-top:4px}
@media (max-width:760px){#top{grid-template-columns:1fr auto}#sbox{grid-column:1/-1;order:-1}}
.ring{fill:none;stroke-width:4;animation:ring .9s ease-out both;animation-delay:var(--d)}
.ring.r2{stroke-width:2.5;animation-delay:calc(var(--d) + .12s)}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(3.4);opacity:0}}
.sp{animation:spark .9s ease-out both;animation-delay:var(--d)}
@keyframes spark{from{transform:rotate(var(--a)) translateX(6px) scale(1);opacity:1}to{transform:rotate(var(--a)) translateX(42px) scale(.2);opacity:0}}
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop2 .75s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--d)}
@keyframes pop2{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.draw{stroke-dasharray:50;animation:draw .6s ease-out both;animation-delay:var(--d)}
@keyframes draw{from{stroke-dashoffset:50}to{stroke-dashoffset:0}}
#banner{position:absolute;top:72px;left:50%;transform:translateX(-50%);z-index:4;pointer-events:none;opacity:0;background:#fff;border-radius:999px;padding:8px 22px;font-size:22px;font-weight:800;box-shadow:0 5px 0 #0003;display:flex;gap:10px;align-items:center;white-space:nowrap}
#banner.show{animation:bnr 2.2s ease-out both}
@keyframes bnr{0%{opacity:0;transform:translate(-50%,-30px) scale(.6)}12%{opacity:1;transform:translate(-50%,0) scale(1.08)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
@media (prefers-reduced-motion:reduce){.ring,.sp,.pop,.draw,#banner.show{animation:none}}
</style></head><body class="s0">
<div id="fx"></div>
<div id="menu"><div class="card" id="mc">Načítám…</div></div>
<div id="game" hidden>
<header id="top"><div id="turn"></div><div id="sbox"><div id="sname"></div><div id="season"></div></div><div class="row" style="margin:0;justify-self:end"><button id="mute" onclick="toggleMute()" aria-label="Zvuk">🔊</button><button onclick="showCosts=true;render()" aria-label="Ceny a období">💰</button></div></header>
<div id="stage"><svg id="b" viewBox="-300 -235 600 470" role="img" aria-label="Herní plán"></svg><div id="feed" aria-live="polite"></div><div id="banner"></div><div id="msg"></div></div>
<footer id="dock"><div id="hand"></div><div id="ac"></div></footer>
<div id="modal" hidden onclick="closeM()"></div>
</div>
<script>
const S=46,R=['wood','brick','sheep','wheat','ore'];
const CZ={wood:'dřevo',brick:'cihla',sheep:'zvěř',wheat:'obilí',ore:'ruda',desert:'poušť'};
const COL={wood:'#4a7c3f',brick:'#b4532e',sheep:'#a6d46f',wheat:'#e4c453',ore:'#8b929c',desert:'#dccfa6'};
const PC=['#d6342c','#2f6fd0','#f08a1c','#2f9e5b'],SEAT=[[-300,150],[-300,-220],[190,-220],[190,150]];
const COST={road:{wood:1,brick:1},settle:{wood:1,brick:1,sheep:1,wheat:1},city:{ore:3,wheat:2}};
let dstate={f:[1,2],rot:[0,0],dy:[0,0]},lastFx=null,lastSeasonSeen=null,wasMine=false,wasOver=false,fxT=0,AC=null,muted=localStorage.getItem('mute')=='1',showCosts=false,showBank=false,fxSeason=-1,db,me,G,H,V,E,code,botT=null,lastRid=0,rolling=false,anim=false,mode=null,tg={give:'wood',get:'ore'},myName='',wantN=4,err='',unsub=null;
const $=id=>document.getElementById(id),rep=(t,n)=>Array(n).fill(t),face=n=>String.fromCodePoint(0x267F+n);
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const vo=v=>G.vo[v.i]??-1,eo=e=>G.eo[e.i]??-1,eOf=v=>E.filter(e=>e.a==v||e.b==v);
const cp=()=>G.P[G.cur],pts=i=>G.P[i].s+2*G.P[i].c,nm=i=>G.P[i].name;
const mine=()=>G.phase!='over'&&G.phase!='lobby'&&cp().uid==me;
const afford=(p,k)=>Object.entries(COST[k]).every(([r,n])=>G.P[p].res[r]>=n);
const pay=(p,k)=>{for(const[r,n]of Object.entries(COST[k]))G.P[p].res[r]-=n};
const ord=()=>{const a=[...Array(G.N).keys()];return[...a,...a.reverse()]};
const SEAS=[{n:'Jaro',e:'🌱',up:['sheep','wood'],down:['ore']},{n:'Léto',e:'☀️',up:['wheat','sheep'],down:['brick']},{n:'Podzim',e:'🍂',up:['brick','wheat'],down:['wood']},{n:'Zima',e:'❄️',up:['ore','brick'],down:['sheep']}];
const adj=(t,k)=>{const q=SEAS[G.season||0];return q.down.includes(t)?0:q.up.includes(t)?k+1:k};
const pip=v=>v.hs.reduce((a,h)=>a+(h.n?6-Math.abs(7-h.n):0),0);
const cards=p=>R.reduce((a,r)=>a+p.res[r],0);
const LOCAL=location.protocol=='file:'||/[?&]local/.test(location.search),st=LOCAL?sessionStorage:localStorage,ls={};
me=st.getItem('uid')||(Math.random().toString(36).slice(2)+Date.now().toString(36));try{st.setItem('uid',me)}catch(e){}
addEventListener('storage',e=>{if(e.key&&e.key.startsWith('g:'))(ls[e.key.slice(2)]||[]).forEach(f=>f())});
db=LOCAL?{doc:p=>{const rd=()=>{const v=localStorage.getItem('g:'+p);return v?JSON.parse(v):null};return{
 set:async d=>{localStorage.setItem('g:'+p,JSON.stringify(d));(ls[p]||[]).forEach(f=>f())},
 get:async()=>{const d=rd();return d?{exists:true,data:()=>d}:{exists:false}},
 onSnapshot:fn=>{const f=()=>{const d=rd();if(d)fn({exists:true,data:()=>d})};(ls[p]=ls[p]||[]).push(f);f()}}}}:
{doc:p=>({
 set:d=>fetch('/api/'+p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(r=>{if(!r.ok)throw 0}),
 get:async()=>{const r=await fetch('/api/'+p);if(!r.ok)return{exists:false};const d=await r.json();return{exists:true,data:()=>d}},
 onSnapshot:fn=>{const es=new EventSource('/api/'+p+'/stream');es.onmessage=e=>{const d=JSON.parse(e.data);fn({exists:true,data:()=>d})}}})};
menu();
function menu(){setFx(0);$('mc').innerHTML=`<h1>🏝️ Osadníci</h1>
 <input id="nm" placeholder="Tvoje jméno" value="${myName}" maxlength="12" style="width:100%">
 <div class="row"><select id="nn"><option value="3">3 hráči</option><option value="4" ${wantN==4?'selected':''}>4 hráči</option></select><button class="go big" onclick="create()" style="flex:1">Nová hra</button></div><hr>
 <div class="row"><input id="cd" placeholder="KÓD" maxlength="4" style="width:6em;text-transform:uppercase;text-align:center"><button class="big" onclick="join()" style="flex:1">Připojit se</button></div>
 ${LOCAL?'<p class="dim">🧪 Testovací režim bez serveru</p>':''}<p id="er" role="alert" style="color:#b3261e">${err}</p>`}
const nameIn=()=>{myName=($('nm').value||'').replace(/[<>&"'`]/g,'').trim().slice(0,12);wantN=+$('nn').value};
async function create(){
 nameIn();code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
 G={v:1,host:me,N:wantN,phase:'lobby',P:[{uid:me,name:myName||'Hráč 1',bot:0}]};
 try{await db.doc('games/'+code).set(G)}catch(e){err='Nepodařilo se vytvořit hru (nemáš právo zápisu?).';return menu()}
 listen()}
async function join(){
 nameIn();code=$('cd').value.trim().toUpperCase();
 try{const s=await db.doc('games/'+code).get();if(!s.exists){err='Hra s tímto kódem neexistuje.';return menu()}
  const g=s.data();
  if(!g.P.some(p=>p.uid==me)){if(g.phase!='lobby'||g.P.length>=g.N){err='Hra je plná nebo už začala.';return menu()}
   g.P.push({uid:me,name:myName||'Hráč '+(g.P.length+1),bot:0});g.v++;await db.doc('games/'+code).set(g)}
  listen()}catch(e){err='Připojení selhalo.';menu()}}
function listen(){db.doc('games/'+code).onSnapshot(s=>{if(!s.exists)return;G=s.data();onState()})}
function onState(){
 if(G.phase=='lobby'){if($('myname')&&document.activeElement==$('myname'))return;$('menu').hidden=false;$('game').hidden=true;
  $('mc').innerHTML=`<h1>Lobby</h1><div class="code">${code}</div><p class="dim" style="text-align:center">Pošli kód kamarádům</p>`+Array.from({length:G.N},(_,i)=>`<div class="pl" style="border-color:${PC[i]}">${G.P[i]?(G.P[i].uid==me?`<input id="myname" value="${G.P[i].name}" maxlength="12" onchange="rename(this.value)" aria-label="Tvoje jméno" style="flex:1;min-width:0"> ★`:G.P[i].name):'<i>🤖 doplní se bot</i>'}</div>`).join('')+(G.host==me?`<button class="go big" style="width:100%;margin-top:8px" onclick="start()">Spustit hru</button>`:'<p class="dim">Čeká se na hostitele…</p>');return}
 $('menu').hidden=true;$('game').hidden=false;if(!H)geo();
 sideFx();if(G.rid&&G.rid!=lastRid){lastRid=G.rid;spin(700,G.dv);setTimeout(rollSnd,850)}
 render();botCheck()}
function geo(){
 H=[];V=[];E=[];const vm={},em={};let t=0;
 for(let q=-2;q<=2;q++)for(let r=-2;r<=2;r++){if(Math.abs(q+r)>2)continue;
  const h={...G.board[t++],x:S*Math.sqrt(3)*(q+r/2),y:S*1.5*r,vs:[]};
  for(let k=0;k<6;k++){const a=Math.PI/180*(60*k-30),px=h.x+S*Math.cos(a),py=h.y+S*Math.sin(a),key=Math.round(px*10)+','+Math.round(py*10);
   if(!(key in vm)){vm[key]=V.length;V.push({i:V.length,x:px,y:py,nb:[],hs:[]})}
   const v=V[vm[key]];v.hs.push(h);h.vs.push(v)}
  H.push(h)}
 for(const h of H)for(let k=0;k<6;k++){const a=h.vs[k],b=h.vs[(k+1)%6];if(!a.nb.includes(b)){a.nb.push(b);b.nb.push(a)}
  const id=Math.min(a.i,b.i)+'-'+Math.max(a.i,b.i);if(!em[id]){em[id]=1;E.push({i:E.length,a,b})}}}
function start(){
 while(G.P.length<G.N)G.P.push({uid:'bot'+G.P.length,name:'Hráč '+(G.P.length+1),bot:1});
 const T=sh([...rep('wood',4),...rep('sheep',4),...rep('wheat',4),...rep('brick',3),...rep('ore',3),'desert']),nums=sh([2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12]);
 G.board=T.map(t=>({t,n:t=='desert'?0:nums.pop()}));G.rob=T.indexOf('desert');
 G.P.forEach(p=>Object.assign(p,{res:{wood:0,brick:0,sheep:0,wheat:0,ore:0},s:0,c:0,r:0}));
 Object.assign(G,{season:0,round:0,vo:{},vc:{},eo:{},cur:0,phase:'setup',step:0,sub:'settle',last:-1,dv:[1,2],msg:'',log:[]});
 geo();save()}
function save(){G.v++;if(G.msg){(G.log=G.log||[]).push(G.msg);G.log=G.log.slice(-6);G.msg=''}render();db.doc('games/'+code).set(G).catch(()=>{$('msg').textContent='Uložení selhalo (nemáš právo zápisu?).'})}
function canSettle(v){return vo(v)==-1&&!v.nb.some(n=>vo(n)>=0)&&(G.phase=='setup'||eOf(v).some(e=>eo(e)==G.cur))}
function canRoad(e){if(eo(e)!=-1)return false;
 if(G.phase=='setup')return e.a.i==G.last||e.b.i==G.last;
 return[e.a,e.b].some(w=>vo(w)==G.cur||(vo(w)==-1&&eOf(w).some(x=>eo(x)==G.cur)))}
function win(){if(pts(G.cur)>=10){G.phase='over';G.msg=nm(G.cur)+' vyhrál s '+pts(G.cur)+' body!'}}
function buildS(v){const c=G.cur;G.vo[v.i]=c;cp().s++;
 if(G.phase=='setup'){G.last=v.i;G.sub='road';if(G.step>=G.N)v.hs.forEach(h=>{if(h.t!='desert')cp().res[h.t]++});G.msg=nm(c)+' položil osadu.'}
 else{pay(c,'settle');mode=null;G.msg=nm(c)+' postavil osadu.';G.fx={n:(G.fx?G.fx.n:0)+1,k:'s',i:v.i,o:c};win()}}
function buildR(e){const c=G.cur;G.eo[e.i]=c;cp().r++;
 if(G.phase=='setup'){G.step++;G.sub='settle';if(G.step==2*G.N){G.phase='roll';G.cur=0}else G.cur=ord()[G.step];G.msg=nm(c)+' položil cestu.'}
 else{pay(c,'road');mode=null;G.msg=nm(c)+' postavil cestu.';G.fx={n:(G.fx?G.fx.n:0)+1,k:'r',i:e.i,o:c}}}
function upCity(v){const c=G.cur;pay(c,'city');G.vc[v.i]=1;cp().s--;cp().c++;mode=null;G.msg=nm(c)+' postavil město.';G.fx={n:(G.fx?G.fx.n:0)+1,k:'c',i:v.i,o:c};win()}
function steal(t){const pool=R.flatMap(r=>rep(r,G.P[t].res[r])),r=pool[Math.random()*pool.length|0];G.P[t].res[r]--;cp().res[r]++;G.msg=(G.msg?G.msg.replace(/\.$/,'')+' a vzal':nm(G.cur)+' vzal')+' kartu hráči '+nm(t)+'.'}
function moveRob(i){G.rob=i;G.msg=nm(G.cur)+' přesunul zloděje.';
 const vic=[...new Set(H[i].vs.map(vo).filter(o=>o>=0&&o!=G.cur&&cards(G.P[o])>0))];
 if(vic.length>1){G.phase='steal';G.vic=vic}
 else{G.phase='main';if(vic.length)steal(vic[0])}}
function pickVic(t){if(!mine()||G.phase!='steal'||!G.vic.includes(t))return;G.phase='main';G.msg='';steal(t);G.vic=null;save()}
function dropRandom(i,n){const p=G.P[i];for(let k=0;k<n;k++){const pool=R.flatMap(r=>rep(r,p.res[r]));p.res[pool[Math.random()*pool.length|0]]--}delete G.disc[i]}
function afterDisc(){if(!Object.keys(G.disc).length){G.phase='robber';G.msg=''}}
let sel={};
const myIdx=()=>G.P.findIndex(p=>p.uid==me),selTot=()=>R.reduce((q,r)=>q+(sel[r]||0),0);
function selAdd(r,d){const i=myIdx(),n=sel[r]||0;if(d>0&&(selTot()>=G.disc[i]||n>=G.P[i].res[r]))return;if(d<0&&n<=0)return;sel[r]=n+d;render()}
function doDiscard(){const i=myIdx(),need=G.disc[i];if(!need||selTot()!=need)return;R.forEach(r=>G.P[i].res[r]-=sel[r]||0);delete G.disc[i];sel={};G.msg=nm(i)+' zahodil '+need+' karet.';afterDisc();save()}
