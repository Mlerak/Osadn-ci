<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Osadníci – multiplayer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--ink:#2e1f12;--paper:#f0e0b4;--wood:#5a3a1c;--gold:#c9a24a;--blood:#7a1f1a}
body{margin:0;min-height:100dvh;color:var(--ink);font:400 16px/1.35 MedievalSharp,Georgia,serif;background:#150e08}
@keyframes pop{from{transform:scale(.7);opacity:0}}
@keyframes ban{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.1);opacity:1}25%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
@keyframes tumble{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(6px,-14px) rotate(100deg)}50%{transform:translate(-5px,0) rotate(200deg)}75%{transform:translate(5px,-9px) rotate(290deg)}100%{transform:translate(0,0) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.toast.new,#thief div,.die.tumble{animation:none}}
button,input,select,.bt{font:inherit;color:var(--ink);border:2px solid var(--gold);outline:1px solid #000;border-radius:3px;padding:7px 13px;background:linear-gradient(#e8d29a,#b99352);box-shadow:0 3px 0 #2a180a;cursor:pointer;display:inline-block}
input[type=text],input:not([type]){background:#f8edc9;box-shadow:inset 0 2px 0 #0002;cursor:text}
button:focus-visible,select:focus-visible,input:focus-visible,.bt:focus-within{outline:3px solid #6fb3ff;outline-offset:2px}
button:disabled{opacity:.4;box-shadow:none;cursor:default}button.sel{background:linear-gradient(#fff0b8,#e2b95c);outline:3px solid #6fb3ff}
.go{background:linear-gradient(#6f9a48,#3f6b24);border-color:#d9c27a;color:#fff;text-shadow:0 1px 0 #0008}.big{font-size:19px;padding:10px 18px}
.dim{color:#7a6446}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
#menu{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 50% 30%,#4a2f18,#150e08 75%)}
.card{background:var(--paper);border:5px double var(--wood);border-radius:4px;padding:24px;max-width:420px;width:100%;box-shadow:0 0 0 3px #000,0 10px 30px #000a}
.card h1{font-size:38px;margin:0 0 12px;text-align:center;color:var(--blood)}.card hr{border:0;border-top:2px dashed #b8975a;margin:14px 0}
.code{font-size:46px;letter-spacing:.3em;text-align:center}
.pl{padding:8px 12px;background:#e6cf94;margin:6px 0;border-left:10px solid}
#game{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top,0px)}
#top{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 12px;flex-wrap:wrap;background:linear-gradient(#3a2514,#241508);border-bottom:3px solid var(--gold);color:var(--paper)}
#turn,#season{display:flex;align-items:center;gap:8px;font-size:15px}#turn{font-size:18px}#turn small{opacity:.7}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--paper);flex:none}
#pl{display:flex;gap:6px;padding:6px 12px;background:#1b1008;overflow-x:auto}
.pp{border-left:8px solid var(--c);background:#e6cf94;padding:3px 10px;font-size:13px;white-space:nowrap;position:relative;flex:1;min-width:120px}.pp b{display:block;font-size:15px}.pp.on{background:#fff0b8;outline:3px solid var(--gold)}.pp em{position:absolute;right:4px;top:2px;background:#2e8b4a;color:#fff;border-radius:9px;padding:0 6px;font-style:normal}
#stage{flex:1;min-height:0;position:relative;background:#000}
#stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#000a)}
#feed{position:absolute;top:4px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:3;width:max-content;max-width:94%}
.toast{background:#241508e6;color:var(--paper);border:1px solid var(--gold);padding:3px 14px;font-size:14px;opacity:.6}.toast.new{opacity:1;font-size:16px;animation:pop .35s}
#msg{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);color:#b3261e;background:var(--paper);padding:0 8px;z-index:3}
#dock{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(#3a2514,#1b1008);border-top:3px solid var(--gold)}
#hand{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:86px;align-items:center;color:var(--paper)}
.rc{width:62px;height:86px;border:3px solid var(--gold);outline:2px solid #000;border-radius:5px;background-size:cover;background-position:center;position:relative;box-shadow:0 3px 0 #0008}
.rc b{position:absolute;top:2px;right:3px;background:#2e1f12;color:var(--paper);border-radius:10px;padding:0 6px;font-size:14px}
.rc small{position:absolute;bottom:0;left:0;right:0;text-align:center;background:#2e1f12cc;color:var(--paper);font-size:11px}
.chip{display:inline-block;width:18px;height:18px;border:1px solid #000;border-radius:2px;background-size:cover;vertical-align:middle;margin:0 1px}
#ac{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.ab{display:flex;flex-direction:column;align-items:center;min-width:70px;font-size:13px;padding:6px 10px}.ab span{min-height:20px}
.dice{display:flex;gap:8px}.die{width:52px;height:52px;background:#efe0b0;border:3px solid #2e1f12;border-radius:8px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px;gap:2px;box-shadow:0 3px 0 #0008}
.die u.o{background:#2e1f12;border-radius:50%}.die.tumble{animation:tumble .45s linear infinite}
#modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:10;padding:12px}
.mbox{background:var(--paper);border:5px double var(--wood);padding:20px;max-width:94vw;max-height:88dvh;overflow:auto;min-width:270px;box-shadow:0 0 0 3px #000,0 10px 30px #000}
.mbox h2{margin:0 0 8px;font-size:22px;color:var(--blood)}.mbox h3{margin:12px 0 4px;font-size:16px;border-bottom:1px solid #b8975a}
.drow,.fr{display:flex;align-items:center;gap:10px;margin:5px 0}.fr span{flex:1}.drow b{min-width:1.5em;text-align:center}
.cost{border-collapse:collapse;margin:6px 0}.cost td{padding:4px 10px;border-top:1px solid #c9ae78}
#thief{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;pointer-events:none}
#thief div{background:linear-gradient(#5a1f1a,#2a0c0a);color:var(--paper);border:4px double var(--gold);padding:10px 34px;font-size:42px;box-shadow:0 10px 0 #0005;animation:ban 1.9s both}
</style>
<style id="rs"></style></head><body>
<div id="thief" hidden><div>Zloděj!</div></div>
<div id="menu"><div class="card" id="mc">Načítám…</div></div>
<div id="game" hidden>
<header id="top"><div id="turn"></div><div id="season"></div><div class="row" style="margin:0"><button onclick="showCosts=true;render()">Ceny</button><button onclick="showFiles=true;render()">Soubory</button><button id="mu" onclick="toggleMute()">Zvuk: zap</button></div></header>
<div id="pl"></div>
<div id="stage"><div id="feed" aria-live="polite"></div><div id="msg"></div></div>
<footer id="dock"><div class="dice"><div class="die"></div><div class="die"></div></div><div id="hand"></div><div id="ac"></div></footer>
</div>
<div id="modal" hidden onclick="closeM()"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const S=46,R=['wood','brick','sheep','wheat','ore'];
const CZ={wood:'dřevo',brick:'cihla',sheep:'zvěř',wheat:'obilí',ore:'ruda',desert:'poušť'};
const PC=['#c4372e','#3470cc','#e8961e','#3a9a56'];
const COST={road:{wood:1,brick:1},settle:{wood:1,brick:1,sheep:1,wheat:1},city:{ore:3,wheat:2}};
let showCosts=false,showBank=false,showFiles=false,db,me,G,H,V,E,code,botT=null,lastRid=0,rolling=false,anim=false,mode=null,tg={give:'wood',get:'ore'},myName='',wantN=4,err='',lastV=-1,lastT='',wasMine=false,muted=false,mus=null;
const $=id=>document.getElementById(id),rep=(t,n)=>Array(n).fill(t);
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const vo=v=>G.vo[v.i]??-1,eo=e=>G.eo[e.i]??-1,eOf=v=>E.filter(e=>e.a==v||e.b==v);
const cp=()=>G.P[G.cur],pts=i=>G.P[i].s+2*G.P[i].c,nm=i=>G.P[i].name;
const mine=()=>G.phase!='over'&&G.phase!='lobby'&&cp().uid==me;
const afford=(p,k)=>Object.entries(COST[k]).every(([r,n])=>G.P[p].res[r]>=n);
const pay=(p,k)=>{for(const[r,n]of Object.entries(COST[k]))G.P[p].res[r]-=n};
const ord=()=>{const a=[...Array(G.N).keys()];return[...a,...a.reverse()]};
const SEAS=[{n:'Jaro',up:['sheep','wood'],down:['ore'],bg:'#26361f',sun:'#fff2c0'},{n:'Léto',up:['wheat','sheep'],down:['brick'],bg:'#3d3014',sun:'#ffe6a0'},{n:'Podzim',up:['brick','wheat'],down:['wood'],bg:'#3a1d0e',sun:'#ffb870'},{n:'Zima',up:['ore','brick'],down:['sheep'],bg:'#26313b',sun:'#dfeaff'}];
const adj=(t,k)=>{const q=SEAS[G.season||0];return q.down.includes(t)?0:q.up.includes(t)?k+1:k};
const pip=v=>v.hs.reduce((a,h)=>a+(h.n?6-Math.abs(7-h.n):0),0);
const cards=p=>R.reduce((a,r)=>a+p.res[r],0);
const chip=r=>`<i class="chip r_${r}"></i>`,chips=l=>l.map(chip).join('');
const PIP=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
const setDie=(el,n)=>el.innerHTML=Array.from({length:9},(_,i)=>`<u${PIP[n].includes(i)?' class="o"':''}></u>`).join('');
/* ---------- vlastní soubory (IndexedDB) + výchozí procedurální grafika a zvuky ---------- */
const ART={},PAL={wood:['#3f6b34','#244a22','#6f9a48'],brick:['#b0603a','#7e3f22','#d58b57'],sheep:['#8fbb5c','#6a9a3e','#f2f0e2'],wheat:['#dcb84a','#a8802a','#f5dc86'],ore:['#858888','#55595a','#c3c6c4'],desert:['#dcc98f','#bda768','#efe3b6'],sea:['#2c6a92','#1c4d70','#74aac8'],table:['#6b4423','#442a12','#8c5e33']},DEFC={};
function def(k){k=k.replace(/^(hex|card)_/,'');return DEFC[k]||(DEFC[k]=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),[b,d,l]=PAL[k];x.fillStyle=b;x.fillRect(0,0,128,128);
 for(let i=0;i<220;i++){const X=Math.random()*128,Y=Math.random()*128;x.fillStyle=x.strokeStyle=Math.random()<.5?d:l;x.globalAlpha=.5;
  if(k=='wood'||k=='ore'){const h=k=='ore'?14:11;x.beginPath();x.moveTo(X,Y);x.lineTo(X-5,Y+h);x.lineTo(X+5,Y+h);x.fill()}
  else if(k=='wheat')x.fillRect(X,Y,2,12);
  else if(k=='sea'){x.beginPath();x.arc(X,Y,6,0,3.14);x.stroke()}
  else if(k=='table')x.fillRect(X,Y,40,2);
  else{x.beginPath();x.arc(X,Y,k=='brick'?7:2.5,0,7);x.fill()}}
 return c.toDataURL()})())}
const artURL=k=>ART[k]||def(k);
const idbDo=(fn,mode)=>new Promise((ok,no)=>{const r=indexedDB.open('osadnici',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onerror=no;r.onsuccess=()=>{const q=fn(r.result.transaction('f',mode).objectStore('f'));q.onsuccess=()=>ok(q.result);q.onerror=no}});
async function loadArt(){try{const ks=await idbDo(s=>s.getAllKeys(),'readonly'),vs=await idbDo(s=>s.getAll(),'readonly');ks.forEach((k,i)=>ART[k]=URL.createObjectURL(vs[i]))}catch(e){}applyArt()}
async function up(k,f){if(!f)return;try{await idbDo(s=>s.put(f,k),'readwrite')}catch(e){}ART[k]=URL.createObjectURL(f);after(k)}
async function rm(k){try{await idbDo(s=>s.delete(k),'readwrite')}catch(e){}delete ART[k];after(k)}
const after=k=>{applyArt();if(k=='s_music')music();upd()};
const inGame=()=>G&&G.phase&&G.phase!='lobby'&&!$('game').hidden;
const upd=()=>inGame()?render():fm();
const fm=()=>{$('modal').innerHTML='<div class="mbox" onclick="event.stopPropagation()">'+filesHTML()+'</div>';$('modal').hidden=false};
const SL=[['Dlaždice',[['hex_wood','Les (dřevo)'],['hex_brick','Kopce (cihla)'],['hex_sheep','Pastviny (zvěř)'],['hex_wheat','Pole (obilí)'],['hex_ore','Hory (ruda)'],['hex_desert','Poušť']]],['Karty v ruce',R.map(r=>['card_'+r,CZ[r]])],['Prostředí',[['sea','Moře'],['table','Stůl a rám plánu']]],['Zvuky',[['s_roll','Hod kostkami'],['s_build','Stavba'],['s_card','Karta / výměna'],['s_robber','Zloděj'],['s_turn','Tvůj tah'],['s_win','Vítězství'],['s_music','Hudba na pozadí']]]];
const filesHTML=()=>'<h2>Vlastní soubory</h2><p class="dim">Ukládají se jen v tomto prohlížeči. Obrázky nejlépe čtvercové, zvuky mp3/ogg/wav.</p>'+SL.map(([g,l])=>`<h3>${g}</h3>`+l.map(([k,n])=>{const s=k.startsWith('s_');return`<div class="fr"><span>${n}</span><label class="bt">${ART[k]?'Změnit':'Nahrát'}<input type="file" hidden accept="${s?'audio/*':'image/*'}" onchange="up('${k}',this.files[0])"></label>${s?`<button onclick="${k=='s_music'?'music()':`sfx('${k.slice(2)}')`}">Test</button>`:''}${ART[k]?`<button onclick="rm('${k}')">Smazat</button>`:''}</div>`}).join('')).join('')+'<p><button class="big" onclick="closeM()">Zavřít</button></p>';
let AC;const tone=(f,d,ty='triangle',v=.15,t0=0)=>{try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}};
const SYN={roll:()=>[0,1,2,3,4].forEach(i=>tone(150+i*30,.08,'square',.07,i*.07)),build:()=>{tone(196,.25,'sawtooth',.08);tone(98,.3,'triangle',.2,.05)},card:()=>{tone(660,.1,'sine');tone(880,.1,'sine',.1,.08)},robber:()=>{tone(80,.5,'sawtooth',.18);tone(70,.6,'square',.08,.1)},turn:()=>{tone(392,.2);tone(523,.3,'triangle',.15,.15)},win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.4,'triangle',.2,i*.18))};
const sfx=k=>{if(muted)return;if(ART['s_'+k]){const a=new Audio(ART['s_'+k]);a.play().catch(()=>0)}else SYN[k]&&SYN[k]()};
function music(){if(mus){mus.pause();mus=null}if(ART.s_music&&!muted){mus=new Audio(ART.s_music);mus.loop=true;mus.volume=.35;mus.play().catch(()=>0)}}
function toggleMute(){muted=!muted;$('mu').textContent='Zvuk: '+(muted?'vyp':'zap');music()}
addEventListener('pointerdown',music,{once:true});
function applyArt(){let s='';for(const r of R)s+=`.r_${r}{background-image:url(${artURL('card_'+r)})}`;$('rs').textContent=s;
 if(!mTable)return;for(const t in HM){HM[t].map=tex('hex_'+t);HM[t].needsUpdate=true}
 mWater.map=tex('sea',2);mTable.map=tex('table',8);mFrame.map=tex('table',3);[mWater,mTable,mFrame].forEach(m=>m.needsUpdate=true)}
/* ---------- síť / úložiště ---------- */
const LOCAL=location.protocol=='file:'||/[?&]local/.test(location.search),st=LOCAL?sessionStorage:localStorage,ls={};
me=st.getItem('uid')||(Math.random().toString(36).slice(2)+Date.now().toString(36));try{st.setItem('uid',me)}catch(e){}
addEventListener('storage',e=>{if(e.key&&e.key.startsWith('g:'))(ls[e.key.slice(2)]||[]).forEach(f=>f())});
db=LOCAL?{doc:p=>{const rd=()=>{const v=localStorage.getItem('g:'+p);return v?JSON.parse(v):null};return{
 set:async d=>{localStorage.setItem('g:'+p,JSON.stringify(d));(ls[p]||[]).forEach(f=>f())},
 get:async()=>{const d=rd();return d?{exists:true,data:()=>d}:{exists:false}},
 onSnapshot:fn=>{const f=()=>{const d=rd();if(d)fn({exists:true,data:()=>d})};(ls[p]=ls[p]||[]).push(f);f()}}}}:
{doc:p=>({
 set:d=>fetch('/api/'+p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(r=>{if(!r.ok)throw 0}),
 get:async()=>{const r=await fetch('/api/'+p);if(!r.ok)return{exists:false};const d=await r.json();return{exists:true,data:()=>d}},
 onSnapshot:fn=>{const es=new EventSource('/api/'+p+'/stream');es.onmessage=e=>{const d=JSON.parse(e.data);fn({exists:true,data:()=>d})}}})};
menu();loadArt();
function menu(){$('menu').hidden=false;$('mc').innerHTML=`<h1>Osadníci</h1>
 <input id="nm" placeholder="Tvoje jméno (nepovinné)" value="${myName}" maxlength="12" style="width:100%">
 <div class="row"><select id="nn"><option value="3">3 hráči</option><option value="4" ${wantN==4?'selected':''}>4 hráči</option></select><button class="go big" onclick="create()" style="flex:1">Nová hra</button></div><hr>
 <div class="row"><input id="cd" placeholder="KÓD" maxlength="4" style="width:6em;text-transform:uppercase;text-align:center"><button class="big" onclick="join()" style="flex:1">Připojit se</button></div>
 <button onclick="showFiles=true;fm()" style="width:100%">Vlastní soubory (grafika, zvuky)</button>
 ${LOCAL?'<p class="dim">Testovací režim bez serveru</p>':''}<p id="er" role="alert" style="color:#b3261e">${err}</p>`}
const nameIn=()=>{myName=($('nm').value||'').trim().slice(0,12);wantN=+$('nn').value};
async function create(){
 nameIn();code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
 G={v:1,host:me,N:wantN,phase:'lobby',P:[{uid:me,name:myName||'Hráč 1',bot:0}]};
 try{await db.doc('games/'+code).set(G)}catch(e){err='Nepodařilo se vytvořit hru (nemáš právo zápisu?).';return menu()}
 listen()}
async function join(){
 nameIn();code=$('cd').value.trim().toUpperCase();
 try{const s=await db.doc('games/'+code).get();if(!s.exists){err='Hra s tímto kódem neexistuje.';return menu()}
  const g=s.data();
  if(!g.P.some(p=>p.uid==me)){if(g.phase!='lobby'||g.P.length>=g.N){err='Hra je plná nebo už začala.';return menu()}
   g.P.push({uid:me,name:myName||'Hráč '+(g.P.length+1),bot:0});g.v++;await db.doc('games/'+code).set(g)}
  listen()}catch(e){err='Připojení selhalo.';menu()}}
function listen(){db.doc('games/'+code).onSnapshot(s=>{if(!s.exists)return;G=s.data();onState()})}
function onState(){
 if(G.phase=='lobby'){$('menu').hidden=false;$('game').hidden=true;
  $('mc').innerHTML=`<h1>Lobby</h1><div class="code">${code}</div><p class="dim" style="text-align:center">Pošli kód kamarádům</p>`+Array.from({length:G.N},(_,i)=>`<div class="pl" style="border-color:${PC[i]}">${G.P[i]?G.P[i].name+(G.P[i].uid==me?' (ty)':''):'<i>doplní se bot</i>'}</div>`).join('')+(G.host==me?`<button class="go big" style="width:100%;margin-top:8px" onclick="start()">Spustit hru</button>`:'<p class="dim">Čeká se na hostitele…</p>')+`<button onclick="showFiles=true;fm()" style="width:100%;margin-top:8px">Vlastní soubory</button>`;return}
 ensure3d();
 if(G.rid&&G.rid!=lastRid){lastRid=G.rid;spin(700,G.dv,flash)}
 render();botCheck()}
function geo(){
 H=[];V=[];E=[];const vm={},em={};let t=0;
 for(let q=-2;q<=2;q++)for(let r=-2;r<=2;r++){if(Math.abs(q+r)>2)continue;
  const h={...G.board[t++],x:S*Math.sqrt(3)*(q+r/2),y:S*1.5*r,vs:[]};
  for(let k=0;k<6;k++){const a=Math.PI/180*(60*k-30),px=h.x+S*Math.cos(a),py=h.y+S*Math.sin(a),key=Math.round(px*10)+','+Math.round(py*10);
   if(!(key in vm)){vm[key]=V.length;V.push({i:V.length,x:px,y:py,nb:[],hs:[]})}
   const v=V[vm[key]];v.hs.push(h);h.vs.push(v)}
  H.push(h)}
 for(const h of H)for(let k=0;k<6;k++){const a=h.vs[k],b=h.vs[(k+1)%6];if(!a.nb.includes(b)){a.nb.push(b);b.nb.push(a)}

 if(G.phase=='over')md=`<h2>${nm(c)} vyhrál!</h2><button class="go big" onclick="location.reload()">Zpět do menu</button>`;
 else if(G.phase=='discard'&&mi>=0&&G.disc[mi]){const need=G.disc[mi],tot=selTot();
  md=`<h2>Zloděj! Zahoď ${need} karet <span class="dim">(${tot}/${need})</span></h2>`+R.filter(r=>my.res[r]).map(r=>`<div class="drow">${chip(r)}<span style="flex:1">${CZ[r]} <small class="dim">(máš ${my.res[r]})</small></span><button onclick="selAdd('${r}',-1)" aria-label="méně">−</button><b>${sel[r]||0}</b><button onclick="selAdd('${r}',1)" aria-label="více">+</button></div>`).join('')+`<button class="go big" style="width:100%;margin-top:8px" ${tot==need?'':'disabled'} onclick="doDiscard()">Zahodit</button>`}
 else if(m&&G.phase=='steal')md='<h2>Komu zloděj ukradne kartu?</h2><div class="row">'+G.vic.map(t=>`<button class="big" style="border:4px solid ${PC[t]}" onclick="pickVic(${t})">${nm(t)} · karet ${cards(G.P[t])}</button>`).join('')+'</div>';
 else if(showFiles)md=filesHTML();
 else if(showBank&&m&&G.phase=='main'){
  if(my.res[tg.give]<4){const f=R.find(r=>my.res[r]>=4);if(f)tg.give=f}if(tg.get==tg.give)tg.get=R.find(r=>r!=tg.give);
  const ok=my.res[tg.give]>=4;
  md=`<h2>Banka</h2><div class="dim">Dáš 4×</div><div class="row">${R.map(r=>`<button class="${tg.give==r?'sel':''}" ${my.res[r]>=4?'':'disabled'} onclick="setTg('give','${r}')">${chip(r)} ${my.res[r]}</button>`).join('')}</div><div class="dim">Dostaneš 1×</div><div class="row">${R.filter(r=>r!=tg.give).map(r=>`<button class="${tg.get==r?'sel':''}" onclick="setTg('get','${r}')">${chip(r)} ${CZ[r]}</button>`).join('')}</div><div class="row"><button class="go big" ${ok?'':'disabled'} onclick="bank()">Vyměnit</button><button onclick="closeM()">Zavřít</button></div>`}
 else if(showCosts){
  md=`<h2>Ceny</h2><table class="cost"><tr><td>Cesta</td><td>${chips(['wood','brick'])}</td><td>0 bodů</td></tr><tr><td>Osada</td><td>${chips(['wood','brick','sheep','wheat'])}</td><td>1 bod</td></tr><tr><td>Město</td><td>${chips(['ore','ore','ore','wheat','wheat'])}</td><td>2 body</td></tr><tr><td>Banka</td><td colspan="2">4× stejná → 1×</td></tr></table><h2 style="margin-top:12px">Období</h2><table class="cost">${SEAS.map(q=>`<tr><td>${q.n}</td><td>+1 ${chips(q.up)}</td><td>bez ${chips(q.down)}</td></tr>`).join('')}</table><button class="big" onclick="closeM()">Zavřít</button>`}
 $('modal').hidden=!md;$('modal').innerHTML=md?`<div class="mbox" onclick="event.stopPropagation()">${md}</div>`:''}
</script></body></html>
